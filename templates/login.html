
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f7f5;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            color: #292929;
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border: 1px solid #e4e3df;
            border-radius: 14px;
            padding: clamp(24px, 5vw, 40px);
        }

        h1 {
            font-size: 28px;
            margin: 0 0 10px;
            font-weight: 600;
        }

        .login-subtitle {
            color: #777777;
            font-size: 15px;
            margin: 0 0 30px;
        }

        .form-row {
            margin-bottom: 22px;
        }

        .form-row label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .form-row input {
            display: block;
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #deded9;
            border-radius: 8px;
            background: #ffffff;
            font-size: 15px;
            color: #292929;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-row input:focus {
            border-color: #777777;
            box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.05);
        }

        button[type="submit"] {
            width: 100%;
            padding: 13px 16px;
            border: none;
            border-radius: 8px;
            background: #292929;
            color: #ffffff;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        button[type="submit"]:hover {
            background: #444444;
        }

        .flash-messages {
            margin-top: 22px;
        }

        .flash-message {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 14px 16px;
            border: 1px solid transparent;
            border-radius: 9px;
            font-size: 14px;
        }

        .flash-success {
            color: #166534;
            background: #f0fdf4;
            border-color: #bbf7d0;
        }

        .flash-error {
            color: #b91c1c;
            background: #fef2f2;
            border-color: #fecaca;
        }

        .flash-close {
            flex: 0 0 auto;
            padding: 0;
            border: 0;
            background: transparent;
            color: inherit;
            font-size: 20px;
            line-height: 1;
            cursor: pointer;
        }

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            .login-container {
                padding: 24px 20px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>
    <div class="login-container">

        <h1>Welcome back</h1>
        <p class="login-subtitle">Please sign in to continue.</p>

        <form action="{{ url_for('login') }}" method="POST">

            <div class="form-row">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-row">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit">Login</button>

        </form>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-messages">
                    {% for category, message in messages %}
                        <div class="flash-message flash-{{ category }}" role="status">
                            <span>{{ message }}</span>
                            <button
                                type="button"
                                class="flash-close"
                                aria-label="Dismiss message"
                            >&times;</button>
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

    </div>

    <script>
        document.querySelectorAll('.flash-close').forEach(button => {
            button.addEventListener('click', () => {
                button.closest('.flash-message').remove();
            });
        });
    </script>

</body>
</html>
