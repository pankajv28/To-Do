<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-container {
            width: 350px;
        }

        .form-row {
            margin-bottom: 20px;
        }

        .form-row input {
            display: block;
            width: 100%;
            padding: 8px;
            margin-top: 6px;
            box-sizing: border-box;
        }

        button {
            padding: 8px 16px;
            cursor: pointer;
        }

        .links {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
        }


        .flash-message {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 14px 18px;
            margin: 16px 0;
            border: 1px solid transparent;
            border-radius: 10px;
            font-size: 14px;
        }
        .flash-success {
            color: #166534;
            background: #f0fdf4;
            border-color: #bbf7d0;
        }
        .flash-error {
            color: #b91c1c;
            background: #fef2f2;
            border-color: #fecaca;
        }
        .flash-close {
            flex: 0 0 auto;
            padding: 0;
            border: 0;
            background: transparent;
            color: inherit;
            font-size: 20px;
            line-height: 1;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <h1>Login</h1>

        <form action="{{url_for('login')}}" method="POST">
            <div class="form-row">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>
            </div>

            <div class="form-row">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit">Login</button>
        </form>


        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-messages">
                    {% for category, message in messages %}
                        <div class="flash-message flash-{{ category }}" role="status">
                            <span>{{ message }}</span>
                            <button type="button" class="flash-close" aria-label="Dismiss message">&times;</button>
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

    </div>

    <script>
        document.querySelectorAll('.flash-close').forEach(button => {
            button.addEventListener('click', () => {
                button.closest('.flash-message').remove();
            });
        });
    </script>

</body>
</html>
